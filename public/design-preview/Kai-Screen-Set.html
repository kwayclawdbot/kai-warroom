// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<script type="text/plain" data-name="kai.jsx">
// kai.jsx — K.ai brand atoms.
//
// Updated for the brand guide: diamond-in-ring core mark, multi-color
// neon ring around the neural orb, expanded palette (no pink), Gambetta
// for hero copy, Inter for everything else.

// Deterministic PRNG — same seed → same cluster.
function kaiPrng(seed) {
  let s = seed | 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) / 4294967295); };
}

// State → primary color (DESIGN-LANGUAGE §10).  Drives the ring tint, the
// inner-core wash, and the region halo when active.
const STATE_COLOR = {
  idle:       null,         // full rainbow ring — brand moment only
  thinking:   '#B855CF',    // violet · intelligence
  speaking:   '#22D687',    // green  · trade insight / output
  insight:    '#22D687',
  alert:      '#FF7A2A',    // orange · alert
  risk:       '#FF4D4D',    // red    · risk
  info:       '#1E80FF',    // blue   · information
  community:  '#FF20E2',    // pink   · community / wins
  win:        '#FF20E2',
};

// Region indicators — 8 around the perimeter, colors per DESIGN-LANGUAGE §10.
const KAI_REGIONS = [
  { id: 'memory',     label: 'memory',     angle: -90, color: '#B855CF' }, // violet — recall, prefs
  { id: 'market',     label: 'market',     angle: -45, color: '#1E80FF' }, // blue   — market data
  { id: 'technicals', label: 'technicals', angle:   0, color: '#22D687' }, // green  — charts, levels
  { id: 'alerts',     label: 'alerts',     angle:  45, color: '#FF7A2A' }, // orange — alerts, signals
  { id: 'watchlist',  label: 'watchlist',  angle:  90, color: '#22D687' }, // green  — opportunity
  { id: 'users',      label: 'users',      angle: 135, color: '#FF20E2' }, // pink   — community
  { id: 'news',       label: 'news',       angle: 180, color: '#1E80FF' }, // blue   — news
  { id: 'options',    label: 'options',    angle: 225, color: '#FF4D4D' }, // red    — options / risk
];

// ─────────────────────────────────────────────────────────────
// KaiMark — the brand mark.  Diamond inside a multi-color ring with
// neon glow.  Use this everywhere a "Kai icon" appears — app icon,
// corner avatar, header logo.  State changes the glow color.
// ─────────────────────────────────────────────────────────────
function KaiMark({ size = 56, state = 'idle', spin = true, label = false }) {
  const stateCol = STATE_COLOR[state];
  const glow = stateCol || '#B855CF';
  return (
    <div style={{
      width: size, height: size, position: 'relative',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    }}>
      {/* outer halo */}
      <div style={{
        position: 'absolute', inset: -size * 0.25,
        borderRadius: '50%',
        background: `radial-gradient(circle, ${glow}55 0%, transparent 60%)`,
        filter: 'blur(8px)',
        animation: 'kai-glow 3s ease-in-out infinite',
        pointerEvents: 'none',
      }} />
      {/* rotating multi-color ring (conic) */}
      <div style={{
        position: 'absolute', inset: 0,
        borderRadius: '50%',
        background: stateCol
          ? `conic-gradient(${stateCol}, ${stateCol}aa, ${stateCol}, ${stateCol}55, ${stateCol})`
          : 'var(--ring-gradient)',
        WebkitMask:    'radial-gradient(circle, transparent 60%, #000 62%, #000 100%)',
        mask:          'radial-gradient(circle, transparent 60%, #000 62%, #000 100%)',
        animation: spin ? 'kai-spin 8s linear infinite' : undefined,
        filter: `drop-shadow(0 0 ${size * 0.12}px ${glow}cc)`,
      }} />
      {/* inner well — dark plate inside the ring */}
      <div style={{
        position: 'absolute', inset: size * 0.10,
        borderRadius: '50%',
        background: 'radial-gradient(circle at 50% 45%, #0d1219 0%, #05080c 100%)',
        border: '1px solid rgba(255,255,255,0.06)',
      }} />
      {/* diamond core — rotated rounded square */}
      <svg width={size * 0.42} height={size * 0.42} viewBox="-50 -50 100 100"
        style={{ position: 'relative', zIndex: 2 }}>
        <defs>
          <linearGradient id={`d-${size}-${state}`} x1="0" y1="-1" x2="0" y2="1">
            <stop offset="0%"  stopColor="#ffffff" stopOpacity="0.95" />
            <stop offset="100%" stopColor={stateCol || '#D8A0F0'} stopOpacity="0.85" />
          </linearGradient>
        </defs>
        <g transform="rotate(45)">
          <rect x={-32} y={-32} width={64} height={64} rx={10}
            fill={`url(#d-${size}-${state})`}
            stroke={stateCol || 'rgba(255,255,255,0.6)'}
            strokeWidth="3"
            style={{ filter: `drop-shadow(0 0 6px ${glow}aa)` }} />
        </g>
      </svg>

      {label && (
        <div style={{
          position: 'absolute', top: '100%', left: '50%', transform: 'translateX(-50%)',
          marginTop: 6, whiteSpace: 'nowrap',
          fontFamily: 'var(--font-display)', fontStyle: 'italic',
          fontSize: size * 0.35, fontWeight: 600, letterSpacing: -0.5,
        }}>
          <span className="gradient-text">K.ai</span>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// KaiOrb — the big neural cloud avatar.  Particle cluster wrapped in
// a multi-color ring; ring tints to state color when not idle.  Region
// indicators sit OUTSIDE the ring for the "users see Kai think" moment.
// ─────────────────────────────────────────────────────────────
function KaiOrb({
  size = 360,
  state = 'idle',
  active = [],
  regions = true,
  labels = false,
  seed = 42,
  intensity = 1,
}) {
  const stateCol = STATE_COLOR[state];
  const rand = React.useMemo(() => kaiPrng(seed), [seed]);

  const particles = React.useMemo(() => {
    const out = [];
    const rings = [
      { r: 6,  n: 14, sz: 0.55, op: 1.0 },
      { r: 14, n: 26, sz: 0.45, op: 0.95 },
      { r: 22, n: 38, sz: 0.42, op: 0.85 },
      { r: 30, n: 48, sz: 0.36, op: 0.70 },
      { r: 36, n: 54, sz: 0.30, op: 0.55 },
      { r: 41, n: 60, sz: 0.24, op: 0.38 },
    ];
    const palette = ['#22D687', '#1E80FF', '#B855CF', '#FF20E2', '#FF4D4D', '#FF7A2A', '#ffffff'];
    for (const ring of rings) {
      for (let i = 0; i < ring.n; i++) {
        const a = (i / ring.n) * Math.PI * 2 + rand() * 0.3;
        const rr = ring.r + (rand() - 0.5) * 4;
        const x = 50 + Math.cos(a) * rr;
        const y = 50 + Math.sin(a) * rr;
        const sz = ring.sz * (0.6 + rand() * 0.8);
        const t = rand();
        // 30% brand color (random pick), rest white-violet wash
        const fill = t < 0.32 ? palette[Math.floor(rand() * palette.length)]
                  : t < 0.58 ? '#ffffff'
                  : t < 0.80 ? '#cbd5e1'
                  :            '#B855CF';
        out.push({ x, y, sz, op: ring.op * (0.5 + rand() * 0.5), fill });
      }
    }
    return out;
  }, [seed, rand]);

  const ringId = `ring-${seed}-${state}`;
  const coreId = `core-${seed}-${state}`;

  return (
    <div style={{
      width: size, height: size, position: 'relative',
      animation: 'kai-breathe 5.4s ease-in-out infinite',
    }}>
      {/* Multi-color conic ring just outside the cluster */}
      <div style={{
        position: 'absolute', inset: size * 0.04,
        borderRadius: '50%',
        background: stateCol
          ? `conic-gradient(${stateCol}, ${stateCol}99, ${stateCol}cc, ${stateCol}66, ${stateCol})`
          : 'var(--ring-gradient)',
        WebkitMask: 'radial-gradient(circle, transparent 75%, #000 76.5%, #000 80%, transparent 81.5%)',
        mask:       'radial-gradient(circle, transparent 75%, #000 76.5%, #000 80%, transparent 81.5%)',
        animation: 'kai-spin 14s linear infinite',
        filter: `drop-shadow(0 0 ${size * 0.04}px ${stateCol || '#B855CF'}aa)`,
        pointerEvents: 'none',
      }} />
      {/* Counter-rotating thinner ring */}
      <div style={{
        position: 'absolute', inset: size * 0.04,
        borderRadius: '50%',
        background: stateCol
          ? `conic-gradient(from 180deg, transparent, ${stateCol}, transparent 60%)`
          : 'conic-gradient(from 180deg, transparent, #ffffff77, transparent 40%)',
        WebkitMask: 'radial-gradient(circle, transparent 70%, #000 71%, #000 72.5%, transparent 73.5%)',
        mask:       'radial-gradient(circle, transparent 70%, #000 71%, #000 72.5%, transparent 73.5%)',
        animation: 'kai-spin-r 22s linear infinite',
      }} />

      <svg viewBox={`-15 -15 130 130`} width={size} height={size}
        style={{ display: 'block', overflow: 'visible', position: 'absolute', inset: 0 }}>
        <defs>
          <radialGradient id={coreId} cx="50%" cy="48%" r="55%">
            <stop offset="0%"   stopColor="#ffffff" stopOpacity="0.85" />
            <stop offset="22%"  stopColor={stateCol || '#D8A0F0'} stopOpacity="0.55" />
            <stop offset="55%"  stopColor={stateCol || '#B855CF'} stopOpacity="0.18" />
            <stop offset="100%" stopColor={stateCol || '#B855CF'} stopOpacity="0" />
          </radialGradient>
          <filter id={`blur-${seed}-${state}`}>
            <feGaussianBlur stdDeviation="0.6" />
          </filter>
        </defs>

        {/* inner core glow */}
        <circle cx="50" cy="50" r="42" fill={`url(#${coreId})`}
          style={{ opacity: state === 'speaking' ? 0.95 : 0.75, transition: 'opacity 200ms' }} />

        {/* particles */}
        <g filter={`url(#blur-${seed}-${state})`} opacity={0.85}>
          {particles.map((p, i) => (
            <circle key={i} cx={p.x} cy={p.y} r={p.sz * intensity} fill={p.fill} opacity={p.op} />
          ))}
        </g>
        <g>
          {particles.filter((_, i) => i % 3 === 0).map((p, i) => (
            <circle key={i} cx={p.x} cy={p.y} r={p.sz * 0.55} fill={p.fill} opacity={p.op * 0.7} />
          ))}
        </g>

        {/* speaking → audio waveform indicator (dashed arc) */}
        {state === 'speaking' && (
          <circle cx="50" cy="50" r="40" fill="none" stroke="#22D687"
            strokeWidth="0.35" strokeDasharray="2 4" opacity="0.55"
            style={{ animation: 'kai-spin 10s linear infinite', transformOrigin: '50px 50px' }} />
        )}

        {/* region indicators outside the ring */}
        {regions && KAI_REGIONS.map((r) => {
          const a = (r.angle * Math.PI) / 180;
          const cx = 50 + Math.cos(a) * 56;
          const cy = 50 + Math.sin(a) * 56;
          const isActive = state === 'thinking' && active.includes(r.id);
          return (
            <g key={r.id}>
              <circle cx={cx} cy={cy} r={isActive ? 2.4 : 1.2}
                fill={isActive ? r.color : 'rgba(255,255,255,0.22)'}
                style={{ transition: 'all 200ms', filter: isActive ? `drop-shadow(0 0 4px ${r.color})` : 'none' }} />
              {isActive && (
                <circle cx={cx} cy={cy} r="5" fill="none" stroke={r.color}
                  strokeWidth="0.4" opacity="0.5">
                  <animate attributeName="r" from="2.4" to="7" dur="1.6s" repeatCount="indefinite" />
                  <animate attributeName="opacity" from="0.6" to="0" dur="1.6s" repeatCount="indefinite" />
                </circle>
              )}
            </g>
          );
        })}
      </svg>
      {labels && (
        <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
          {KAI_REGIONS.map((r) => {
            const a = (r.angle * Math.PI) / 180;
            const cx = 0.5 + (Math.cos(a) * 56) / 130;
            const cy = 0.5 + (Math.sin(a) * 56) / 130;
            const isActive = state === 'thinking' && active.includes(r.id);
            return (
              <div key={r.id} style={{
                position: 'absolute', left: `${cx * 100}%`, top: `${cy * 100}%`,
                transform: `translate(-50%, ${a < 0 ? '-180%' : a > Math.PI ? '-180%' : '60%'})`,
                fontFamily: 'var(--font-mono)',
                fontSize: Math.max(8, size / 38),
                fontWeight: 500,
                color: isActive ? r.color : 'rgba(255,255,255,0.30)',
                letterSpacing: '0.08em', textTransform: 'uppercase',
                transition: 'color 200ms', whiteSpace: 'nowrap',
                textShadow: isActive ? `0 0 8px ${r.color}aa` : 'none',
              }}>{r.label}</div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// KaiWordmark — "K.ai" with multi-color gradient + Gambetta italic.
// Used as the brand hero (welcome screen, sign-in).
// ─────────────────────────────────────────────────────────────
function KaiWordmark({ size = 80, by = false }) {
  return (
    <div style={{ display: 'inline-flex', flexDirection: 'column', alignItems: 'flex-start' }}>
      <span className="gradient-text" style={{
        fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 700,
        fontSize: size, lineHeight: 0.95, letterSpacing: -size * 0.04,
        filter: 'drop-shadow(0 4px 24px rgba(139,92,246,0.4))',
      }}>K.ai</span>
      {by && (
        <span style={{
          fontFamily: 'var(--font-mono)', fontSize: size * 0.10,
          letterSpacing: '0.24em', color: 'var(--t-3)', textTransform: 'uppercase',
          marginTop: 4,
        }}>by · cheat · code</span>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Sparkline — same as before, brand colors.
// ─────────────────────────────────────────────────────────────
function KaiSparkline({ data, width = 60, height = 22, color, lineWidth = 1.4, fill = true }) {
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / span) * (height - 3) - 1.5;
    return [x, y];
  });
  const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'} ${x.toFixed(2)} ${y.toFixed(2)}`).join(' ');
  const stroke = color || (data[data.length - 1] >= data[0] ? '#22D687' : '#FF4D4D');
  const id = React.useId();
  return (
    <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
      {fill && (
        <>
          <defs>
            <linearGradient id={`sp-${id}`} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={stroke} stopOpacity="0.32" />
              <stop offset="100%" stopColor={stroke} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${d} L ${width} ${height} L 0 ${height} Z`} fill={`url(#sp-${id})`} />
        </>
      )}
      <path d={d} stroke={stroke} strokeWidth={lineWidth} fill="none"
        strokeLinecap="round" strokeLinejoin="round"
        style={{ filter: `drop-shadow(0 0 3px ${stroke}88)` }} />
    </svg>
  );
}

// Mini candle stub (alerts list / thumbs)
function KaiMiniCandle({ width = 60, height = 26, seed = 4 }) {
  const rand = kaiPrng(seed);
  const n = 14, w = (width - 2) / n, hi = height - 2;
  const out = []; let v = 0.5;
  for (let i = 0; i < n; i++) {
    const o = v;
    v = Math.max(0.05, Math.min(0.95, v + (rand() - 0.5) * 0.22));
    const high = Math.max(o, v) + rand() * 0.05;
    const low  = Math.min(o, v) - rand() * 0.05;
    const cx = 1 + i * w + w * 0.5;
    out.push({ cx, top: 1 + (1-high) * hi, bot: 1 + (1-low) * hi,
      yo: 1 + (1-o) * hi, yc: 1 + (1-v) * hi, up: v >= o });
  }
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      {out.map((c, i) => (
        <g key={i}>
          <line x1={c.cx} x2={c.cx} y1={c.top} y2={c.bot}
            stroke={c.up ? '#22D687' : '#FF4D4D'} strokeWidth="0.5" />
          <rect x={c.cx - w * 0.32} width={w * 0.64}
            y={Math.min(c.yo, c.yc)} height={Math.max(1, Math.abs(c.yo - c.yc))}
            fill={c.up ? '#22D687' : '#FF4D4D'} />
        </g>
      ))}
    </svg>
  );
}

// Tier badge — VIP+ is the pink "wins" accent per §5.
function KaiTier({ tier = 'pro' }) {
  const map = {
    basic:  { label: 'BASIC',  cls: 'kai-pill kai-pill--dim' },
    pro:    { label: 'PRO',    cls: 'kai-pill kai-pill--blue' },
    vip:    { label: 'VIP',    cls: 'kai-pill kai-pill--violet' },
    'vip+': { label: 'VIP+',   cls: 'kai-pill kai-pill--pink' },
  };
  const t = map[tier] || map.pro;
  return <span className={t.cls} style={{ fontWeight: 700 }}>{t.label}</span>;
}

// ─────────────────────────────────────────────────────────────
// Bottom tab bar — tab gets its semantic brand color when active.
// Home/profile = violet (intelligence/memory), Alerts = orange,
// Watchlist = green (opportunity), Folio = green (P&L).
// ─────────────────────────────────────────────────────────────
const KAI_TABS = [
  { id: 'home',      label: 'Kai',    color: '#B855CF',
    icon: <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l9 9-9 9-9-9z"/><path d="M12 8l4 4-4 4-4-4z"/></svg> },
  { id: 'alerts',    label: 'Alerts', color: '#FF7A2A',
    icon: <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg> },
  { id: 'watchlist', label: 'Watch',  color: '#22D687',
    icon: <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> },
  { id: 'portfolio', label: 'Folio',  color: '#22D687',

function KaiPTT({ state = 'idle', size = 72 }) {

    thinking:  { bg: 'rgba(184,85,207,0.85)', color: '#fff', icon: 'wave',

    speaking:  { bg: 'rgba(34,214,135,0.88)', color: '#08090c', icon: 'wave',
                 glow: '#22D687', ring: true },
    disabled:  { bg: 'rgba(255,255,255,0.06)', color: 'rgba(248,250,252,0.38)', icon: 'mic',
                 glow: 'transparent', ring: false },

    <div style={{ position: 'relative', width: size, height: size }}>

        position: 'absolute', inset: -6, borderRadius: '50%',

          : `conic-gradient(${cfg.glow}, ${cfg.glow}77, ${cfg.glow}, ${cfg.glow}55, ${cfg.glow})`,
        WebkitMask: 'radial-gradient(circle, transparent 70%, #000 72%, #000 78%, transparent 80%)',
        mask:       'radial-gradient(circle, transparent 70%, #000 72%, #000 78%, transparent 80%)',
        animation: 'kai-spin 6s linear infinite',
        filter: `drop-shadow(0 0 12px ${cfg.glow}cc)`,
      }} />
      {cfg.ring && (
        <div style={{
          position: 'absolute', inset: -14, borderRadius: '50%',
          border: `1.5px solid ${cfg.glow}`, opacity: 0.5,
          animation: 'kai-glow 1.4s ease-in-out infinite',
        }} />
      )}
      <div style={{
        width: size, height: size, borderRadius: '50%', background: cfg.bg,
        boxShadow: state === 'disabled' ? 'none'
          : `0 8px 24px ${cfg.glow}66, inset 0 1px 0 rgba(255,255,255,0.3)`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: cfg.color, position: 'relative', zIndex: 1,
      }}>
        {cfg.icon === 'mic' && (
          <svg width={size * 0.42} height={size * 0.42} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" />
            <path d="M5 11a7 7 0 0014 0M12 18v3" />
          </svg>
        )}
        {cfg.icon === 'pulse' && (
          <svg width={size * 0.52} height={size * 0.52} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round">
            <path d="M3 12h2l3-8 4 16 3-10 2 6h4" />
          </svg>
        )}
        {cfg.icon === 'wave' && (
          <div style={{ display: 'flex', gap: 3, alignItems: 'center' }}>
            {[0.4, 0.7, 1.0, 0.7, 0.4].map((h, i) => (
              <div key={i} style={{
                width: 3, height: size * 0.42 * h, borderRadius: 2,
                background: 'currentColor',
                animation: `kai-glow 1.2s ease-in-out infinite ${i * 0.08}s`,
              }} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

<script type="text/plain" data-name="screens-home.jsx">
// screens-home.jsx — Home (Kai voice) and the seven panels it hosts.
// All 402×874, dark mode, inside the canvas IOSDevice wrapper.

// ─────────────────────────────────────────────────────────────
// KaiChart — design-time stand-in for lightweight-charts.
// Renders heatmap-coloured candles, an EMA8/21 cloud, Kai-drawn levels
// with labels, and a volume strip below.  All from a seeded series so
// every screen shows the same NVDA tape.
// ─────────────────────────────────────────────────────────────
function nvdaSeries(n = 56, seed = 7) {
  let s = seed | 0 || 1;
  const r = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) / 4294967295); };
  const out = [];
  let p = 124.2;
  for (let i = 0; i < n; i++) {
    const o = p;
    const drift = (r() - 0.45) * 0.7 + (i / n - 0.5) * 0.04;
    const vol = 0.4 + r() * 0.7;
    p = Math.max(118, Math.min(132, p + drift * vol));
    const hi = Math.max(o, p) + r() * 0.5;
    const lo = Math.min(o, p) - r() * 0.5;
    out.push({ o, c: p, h: hi, l: lo, v: 0.3 + r() * 0.9 });
  }
  return out;
}

function KaiChart({
  width = 360, height = 240,
  ticker = 'NVDA',
  levels = [
    { p: 128.5, label: 'R · 128.50',    color: '#FF4D4D', kind: 'resistance' },
    { p: 125.2, label: 'EMA21 reclaim', color: '#FF7A2A', kind: 'pivot' },
    { p: 122.4, label: 'S · 122.40',    color: '#22D687', kind: 'support' },
  ],
  series,
  showVolume = true,
  showAnnotations = true,
}) {
  const data = series || nvdaSeries(56, 7);
  const min = Math.min(...data.map(d => d.l)) - 0.4;
  const max = Math.max(...data.map(d => d.h)) + 0.4;
  const span = max - min;

  const volH = showVolume ? 28 : 0;
  const priceH = height - volH;
  const pad = 4;
  const W = width - 2 * pad;
  const cw = W / data.length;

  const y = (p) => pad + (1 - (p - min) / span) * (priceH - 2 * pad);

  // EMA approximations for the cloud
  const ema = (k) => {
    const a = 2 / (k + 1); let e = data[0].c; const out = [];
    for (const d of data) { e = e + a * (d.c - e); out.push(e); }
    return out;
  };
  const e8 = ema(8), e21 = ema(21);
  const cloudUp = e8.map((v, i) => v >= e21[i]);
  const pathPts = (vals) => vals.map((v, i) =>
    `${i ? 'L' : 'M'} ${(pad + i * cw + cw * 0.5).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');

  return (
    <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id={`cloud-${ticker}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#22D687" stopOpacity="0.28" />
          <stop offset="100%" stopColor="#22D687" stopOpacity="0.02" />
        </linearGradient>
      </defs>

      {/* horizontal grid */}
      {[0.25, 0.5, 0.75].map((t) => (
        <line key={t} x1={pad} x2={pad + W} y1={pad + t * (priceH - 2 * pad)} y2={pad + t * (priceH - 2 * pad)}
          stroke="rgba(255,255,255,0.04)" strokeDasharray="2 4" />
      ))}

      {/* EMA cloud — fill between e8 and e21 */}
      <path
        d={
          e8.map((v, i) => `${i ? 'L' : 'M'} ${pad + i * cw + cw * 0.5} ${y(v)}`).join(' ')
          + ' '
          + e21.slice().reverse().map((v, i) => `L ${pad + (e21.length - 1 - i) * cw + cw * 0.5} ${y(v)}`).join(' ')
          + ' Z'
        }
        fill={`url(#cloud-${ticker})`} opacity="0.8"
      />
      <path d={pathPts(e8)}  stroke="#6DFFB1" strokeWidth="1.2" fill="none" opacity="0.7" />
      <path d={pathPts(e21)} stroke="#22D687" strokeWidth="1"   fill="none" opacity="0.5" />

      {/* Kai-drawn levels (staggered would be animated; here static) */}
      {showAnnotations && levels.map((lv, i) => (
        <g key={i}>
          <line x1={pad} x2={pad + W} y1={y(lv.p)} y2={y(lv.p)}
            stroke={lv.color} strokeWidth="0.8" strokeDasharray="3 3" opacity="0.85" />
          <rect x={pad + W - 88} y={y(lv.p) - 9} width="88" height="16"
            fill={lv.color === '#FF4D4D' ? '#2a0a0a' : lv.color === '#22D687' ? '#0a2218' : '#2a1808'}
            rx="3" stroke={lv.color} strokeOpacity="0.6" />
          <text x={pad + W - 84} y={y(lv.p) + 2.5} fontFamily="JetBrains Mono"
            fontSize="9" fontWeight="500" fill={lv.color} letterSpacing="0.04em">
            {lv.label}
          </text>
        </g>
      ))}

      {/* Candles */}
      {data.map((d, i) => {
        const cx = pad + i * cw + cw * 0.5;
        const up = d.c >= d.o;
        const col = up ? '#22D687' : '#FF4D4D';
        // Heatmap intensity: small bodies dim, large bodies bright
        const bodyH = Math.max(1, Math.abs(y(d.o) - y(d.c)));
        const intensity = Math.min(1, bodyH / 16);
        const fill = up ? `rgba(34,214,135,${0.45 + 0.5 * intensity})` : `rgba(255,77,77,${0.45 + 0.5 * intensity})`;
        return (
          <g key={i}>
            <line x1={cx} x2={cx} y1={y(d.h)} y2={y(d.l)} stroke={col} strokeWidth="0.6" opacity="0.75" />
            <rect
              x={cx - cw * 0.32} width={cw * 0.64}
              y={Math.min(y(d.o), y(d.c))} height={bodyH}
              fill={fill} stroke={col} strokeOpacity="0.5" strokeWidth="0.4"
            />
          </g>
        );
      })}

      {/* Last-price callout */}
      {(() => {
        const last = data[data.length - 1].c;
        return (
          <g>
            <line x1={pad} x2={pad + W} y1={y(last)} y2={y(last)} stroke="rgba(34,214,135,0.42)" strokeWidth="0.6" />
            <rect x={pad + W - 50} y={y(last) - 10} width="48" height="18" rx="3" fill="#22D687" />
            <text x={pad + W - 46} y={y(last) + 4} fontFamily="JetBrains Mono"
              fontSize="10" fontWeight="600" fill="#08090c">{last.toFixed(2)}</text>
          </g>
        );
      })()}

      {/* Volume strip */}
      {showVolume && (
        <g transform={`translate(0, ${priceH})`}>
          {data.map((d, i) => {
            const up = d.c >= d.o;
            const vh = d.v * (volH - 4);
            return (
              <rect key={i}
                x={pad + i * cw + cw * 0.2} width={cw * 0.6}
                y={volH - vh - 2} height={vh}
                fill={up ? 'rgba(34,214,135,0.55)' : 'rgba(255,77,77,0.55)'} />
            );
          })}
        </g>
      )}
    </svg>
  );
}

  <script>
    // Loader — reads each inlined source block, transforms with Babel, evals
    // in global scope so `function Foo()` declarations land on `window` for
    // later blocks to consume. Same mechanism as the original Kai-Screen-Set
    // HTML, just sourcing from inline <script type="text/plain"> instead of
    // fetch().
    (() => {
      const errBox = (msg) => {
        const d = document.createElement('pre');
        d.style.cssText = 'color:#ff6b58;background:#0a0f14;padding:20px;font-family:monospace;font-size:12px;white-space:pre-wrap;position:fixed;inset:20px;overflow:auto;z-index:9999;border:1px solid #ff1e00';
        d.textContent = msg;
        document.body.appendChild(d);
      };
      const blocks = document.querySelectorAll('script[type="text/plain"][data-name]');
      try {
        for (const node of blocks) {
          const src = node.textContent;
          const name = node.dataset.name;
          let out;
          try {
            out = Babel.transform(src, { presets: ['react'], filename: name }).code;
          } catch (e) {
            throw new Error(`[babel] ${name}: ${e.message}`);
          }
          try { (0, eval)(out); }
          catch (e) { throw new Error(`[run] ${name}: ${e.message}\n${e.stack || ''}`); }
        }
      } catch (e) {
        console.error(e);
        errBox(String(e.message || e));
      }
    })();
  </script>
